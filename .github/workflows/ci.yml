name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aivideo_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://app:password@localhost:5432/aivideo_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Byte-compile (fast syntax check)
        working-directory: backend
        run: python -m py_compile $(find app -name "*.py")

      - name: Run Alembic migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -v

      - name: Install ffmpeg (for render integration checks)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: End-to-end pipeline smoke test
        working-directory: backend
        run: |
          pip install moto[s3]
          python scripts/smoke_test.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f infra/docker/backend.Dockerfile -t ai-video-backend .

      - name: Build worker image
        run: docker build -f infra/docker/worker.Dockerfile -t ai-video-worker .

      - name: Build frontend image
        run: docker build -f infra/docker/frontend.Dockerfile -t ai-video-frontend .
